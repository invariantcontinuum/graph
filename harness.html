<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GraphToolbar Verification</title>
    <!-- React & ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // Minimal stub for GraphToolbar
        const { useState, useCallback } = React;

        function GraphToolbar({ graphRef, themeMode = "dark" }) {
          const [searchQuery, setSearchQuery] = useState("");

          const handleFocus = useCallback((e) => {}, []);
          const handleBlur = useCallback((e) => {}, []);
          const handleMouseEnter = useCallback((e) => {}, []);
          const handleMouseLeave = useCallback((e) => {}, []);

          const handleSearch = useCallback(
            (e) => {
              e.preventDefault();
              if (!graphRef.current || !searchQuery.trim()) return;
              const found = graphRef.current.search(searchQuery.trim());
              if (found.length > 0) {
                graphRef.current.focusFit(found[0].id, 40);
              } else {
                const input = e.currentTarget.elements.namedItem("search");
                if (input) {
                  input.setCustomValidity("No nodes found");
                  input.reportValidity();
                }
              }
            },
            [graphRef, searchQuery],
          );

          return (
            <div
              role="toolbar"
              aria-label="Graph controls"
              style={{
                display: "flex",
                gap: 8,
                alignItems: "center",
                padding: "6px 12px",
              }}
            >
              <form onSubmit={handleSearch} style={{ display: "flex", gap: 4 }}>
                <input
                  name="search"
                  type="search"
                  placeholder="Search nodes…"
                  value={searchQuery}
                  onChange={(e) => {
                    e.target.setCustomValidity("");
                    setSearchQuery(e.target.value);
                  }}
                  aria-label="Search nodes"
                />
                <button type="submit" aria-label="Submit search">
                  🔍
                </button>
              </form>
            </div>
          );
        }

        function App() {
            // Mock graphRef
            const mockGraphRef = {
                current: {
                    search: (query) => {
                        if (query.toLowerCase() === "existing") {
                            return [{ id: "1", name: "Existing" }];
                        }
                        return [];
                    },
                    focusFit: (id, padding) => {
                        console.log(`Focused on ${id}`);
                    }
                }
            };

            return (
                <div style={{ padding: 20 }}>
                    <GraphToolbar graphRef={mockGraphRef} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
