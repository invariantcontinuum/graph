name: Publish

# Runs on every published release (created automatically by release.yml).
# Publishes the package to GitHub Packages, optionally to npmjs.org, then
# fans out a `graph-release` repository_dispatch so the showcase and docs
# sites rebuild against the new version.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build WASM package
        uses: invariantcontinuum/actions-library/build-wasm-package@main

      - name: Setup Node for GitHub Packages
        uses: invariantcontinuum/actions-library/setup-node-gh-packages@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        working-directory: pkg
        run: npm publish

  publish-npmjs:
    name: Publish to npmjs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for NPM_TOKEN secret
        id: npm-token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret not set; skipping npmjs publish"
          fi

      - uses: actions/checkout@v4
        if: steps.npm-token.outputs.present == 'true'

      - name: Build WASM package
        if: steps.npm-token.outputs.present == 'true'
        uses: invariantcontinuum/actions-library/build-wasm-package@main

      - name: Point package at npmjs
        if: steps.npm-token.outputs.present == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('pkg/package.json', 'utf8'));
            p.publishConfig = { registry: 'https://registry.npmjs.org', access: 'public' };
            fs.writeFileSync('pkg/package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - uses: actions/setup-node@v4
        if: steps.npm-token.outputs.present == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish (skips versions already on npmjs)
        if: steps.npm-token.outputs.present == 'true'
        working-directory: pkg
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@invariantcontinuum/graph@${VERSION}" version >/dev/null 2>&1; then
            echo "@invariantcontinuum/graph@${VERSION} already on npmjs; skipping"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-sites:
    name: Dispatch site rebuilds
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Read released version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Dispatch to showcase
        uses: invariantcontinuum/actions-library/repo-dispatch@main
        with:
          token: ${{ secrets.GH_PAT }}
          repository: invariantcontinuum/showcase
          event-type: graph-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}"}'

      - name: Dispatch to docs
        uses: invariantcontinuum/actions-library/repo-dispatch@main
        with:
          token: ${{ secrets.GH_PAT }}
          repository: invariantcontinuum/docs
          event-type: graph-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}"}'
