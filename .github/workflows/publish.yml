name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (leave empty to use release tag)"
        required: false

jobs:
  publish-npm:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - name: Build WASM targets
        run: |
          wasm-pack build --target web --out-dir ../../pkg crates/graph-worker-wasm --out-name graph_worker_wasm
          wasm-pack build --target web --out-dir ../../pkg-main crates/graph-main-wasm --out-name graph_main_wasm
          cp pkg-main/graph_main_wasm* pkg/
          rm -rf pkg-main
      - name: Prepare package
        run: |
          cp -r react/ pkg/react/
          cp package.json pkg/package.json
          [ -f README.md ] && cp README.md pkg/README.md || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - name: Publish
        working-directory: pkg
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npmjs:
    name: Publish to npmjs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for NPM_TOKEN secret
        id: npm-token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret not set; skipping npmjs publish"
          fi
      - uses: actions/checkout@v4
        if: steps.npm-token.outputs.present == 'true'
      - uses: dtolnay/rust-toolchain@nightly
        if: steps.npm-token.outputs.present == 'true'
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.npm-token.outputs.present == 'true'
      - name: Install wasm-pack
        if: steps.npm-token.outputs.present == 'true'
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - name: Build WASM targets
        if: steps.npm-token.outputs.present == 'true'
        run: |
          wasm-pack build --target web --out-dir ../../pkg crates/graph-worker-wasm --out-name graph_worker_wasm
          wasm-pack build --target web --out-dir ../../pkg-main crates/graph-main-wasm --out-name graph_main_wasm
          cp pkg-main/graph_main_wasm* pkg/
          rm -rf pkg-main
      - name: Prepare package
        if: steps.npm-token.outputs.present == 'true'
        run: |
          cp -r react/ pkg/react/
          cp package.json pkg/package.json
          [ -f README.md ] && cp README.md pkg/README.md || true
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('pkg/package.json', 'utf8'));
            p.publishConfig = { registry: 'https://registry.npmjs.org', access: 'public' };
            fs.writeFileSync('pkg/package.json', JSON.stringify(p, null, 2) + '\n');
          "
      - uses: actions/setup-node@v4
        if: steps.npm-token.outputs.present == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish (skips versions already on npmjs)
        if: steps.npm-token.outputs.present == 'true'
        working-directory: pkg
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@invariantcontinuum/graph@${VERSION}" version >/dev/null 2>&1; then
            echo "@invariantcontinuum/graph@${VERSION} already on npmjs; skipping"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
