name: Release

# Every merge to main cuts a release automatically. The bump level is derived
# from conventional commits since the last tag (feat! → major, feat → minor,
# else patch); workflow_dispatch still allows an explicit override.
#
# The version commit + tag are pushed with GITHUB_TOKEN (which never triggers
# another workflow run), while the GitHub Release is created with GH_PAT so
# the `release: published` event fires publish.yml.

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump override (empty = derive from commits)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - major
          - minor
          - patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Belt-and-braces: never release a release commit.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute bump level
        id: level
        uses: invariantcontinuum/actions-library/compute-version-bump@main
        with:
          override: ${{ inputs.bump }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump package version
        id: bump
        env:
          BUMP: ${{ steps.level.outputs.bump }}
        run: |
          npm version "$BUMP" -m "chore(release): v%s"
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push version commit and tag
        run: |
          git push origin main
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release ${{ steps.bump.outputs.tag }}" \
            --generate-notes
